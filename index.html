<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STFC Mechanics Atlas — Concept Demo</title>
<style>
  :root{
    --bg:#05080F; --bg-2:#0A1120; --panel:#0C1526; --line:#1B2A45;
    --ink:#E9EEF8; --ink-dim:#8FA0BD; --ink-faint:#55658A;
    --accent:#F2B04A;
    --c-combat:#4FD8CF; --c-iso:#9D8CFF; --c-status:#FF8A5C; --c-officer:#FFC66B;
    --c-armada:#FF6BB5; --c-nav:#5BA8FF; --c-econ:#6BDB8C; --c-pvp:#FF5A6E;
    --display:'Avenir Next Condensed','Helvetica Neue Condensed','Arial Narrow',system-ui,sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
  canvas#stars{position:fixed;inset:0;z-index:0}
  svg#map{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
  svg#map.dragging{cursor:grabbing}

  header{
    position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:18px 22px;gap:16px;
  }
  .brand{pointer-events:auto}
  .brand h1{
    font-family:var(--display);font-weight:600;font-size:clamp(18px,2.4vw,26px);
    letter-spacing:.24em;text-transform:uppercase;line-height:1.1;
  }
  .brand h1 em{color:var(--accent);font-style:normal}
  .brand p{
    font-family:var(--mono);font-size:11px;color:var(--ink-dim);
    letter-spacing:.08em;margin-top:6px;
  }
  .searchbox{pointer-events:auto;position:relative}
  .searchbox input{
    width:min(280px,42vw);padding:9px 12px;
    background:rgba(12,21,38,.85);border:1px solid var(--line);border-radius:4px;
    color:var(--ink);font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;
    outline:none;
  }
  .searchbox input::placeholder{color:var(--ink-faint)}
  .searchbox input:focus{border-color:var(--accent)}

  .legend{
    position:fixed;left:22px;bottom:22px;z-index:5;
    background:rgba(10,17,32,.82);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;max-width:230px;
  }
  .legend h2{
    font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink-dim);margin-bottom:9px;
  }
  .legend button{
    display:flex;align-items:center;gap:8px;width:100%;
    background:none;border:none;color:var(--ink-dim);cursor:pointer;
    font-family:var(--body);font-size:12.5px;padding:3px 2px;text-align:left;border-radius:3px;
  }
  .legend button:hover,.legend button:focus-visible{color:var(--ink);outline:none}
  .legend button:focus-visible{box-shadow:0 0 0 1px var(--accent)}
  .legend .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .viewbtns{position:fixed;right:22px;bottom:22px;z-index:5;display:flex;gap:8px}
  .viewbtns button{
    width:34px;height:34px;border-radius:4px;border:1px solid var(--line);
    background:rgba(10,17,32,.82);color:var(--ink-dim);font-size:15px;cursor:pointer;
    font-family:var(--mono);
  }
  .viewbtns button:hover{color:var(--ink);border-color:var(--ink-faint)}
  .viewbtns .reset{width:auto;padding:0 12px;font-size:11px;letter-spacing:.1em}

  .lane{fill:none;stroke-width:1;opacity:.35;transition:opacity .18s,stroke-width .18s}
  .lane.cross{stroke:var(--accent);stroke-dasharray:3 5;opacity:.3}
  .lane.lit{opacity:.95;stroke-width:1.8}
  .lane.dimmed{opacity:.05}
  .cluster-label{
    font-family:var(--display);font-weight:600;text-transform:uppercase;
    letter-spacing:.42em;fill:var(--ink-faint);opacity:.8;pointer-events:none;
    font-size:var(--clusterfs,15px);
  }
  .node circle.hit{r:var(--hitr,20px)}
  .node.big text{font-size:var(--bigfs,10.5px)}
  .zoomed-out .node:not(.big) text{display:none}
  .zoomed-out .node.big text{fill:var(--ink)}
  .node{cursor:pointer}
  .node circle.halo{opacity:0;transition:opacity .18s}
  .node text{
    font-family:var(--body);font-size:10.5px;fill:var(--ink-dim);
    pointer-events:none;transition:fill .15s;
  }
  .node:hover text,.node.lit text{fill:var(--ink)}
  .node:hover circle.halo,.node.lit circle.halo{opacity:.45}
  .node.dimmed{opacity:.15}
  .node.hit circle.halo{opacity:.7}
  .node.selected circle.halo{opacity:.9}
  @media (prefers-reduced-motion:no-preference){
    .node.hit circle.halo{animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
  }

  .dossier{
    position:fixed;top:0;right:0;bottom:0;z-index:6;width:min(400px,100vw);
    background:linear-gradient(180deg,var(--panel),var(--bg-2));
    border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
    display:flex;flex-direction:column;
  }
  @media (prefers-reduced-motion:reduce){.dossier{transition:none}}
  .dossier.open{transform:none;box-shadow:-24px 0 60px rgba(0,0,0,.5)}
  .dossier-head{position:relative;padding:20px 22px 0;border-bottom:1px solid var(--line)}
  .dossier-head .sys{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    display:flex;align-items:center;gap:7px;color:var(--ink-dim);
  }
  .dossier-head .sys .dot{width:7px;height:7px;border-radius:50%}
  .dossier-head h3{
    font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:.05em;
    margin:8px 36px 14px 0;text-wrap:balance;
  }
  .dossier-head button.close{
    position:absolute;top:14px;right:14px;width:30px;height:30px;
    background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink-dim);
    font-size:14px;cursor:pointer;
  }
  .dossier-head button.close:hover{color:var(--ink)}
  .tabs{display:flex;gap:2px}
  .tabs button{
    background:none;border:none;border-bottom:2px solid transparent;
    color:var(--ink-faint);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:8px 10px;cursor:pointer;
  }
  .tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .tabs button:hover{color:var(--ink)}
  .dossier-body{padding:18px 22px 26px;overflow-y:auto;flex:1;font-size:14px;line-height:1.62}
  .dossier-body p{margin-bottom:12px}
  .dossier-body p.dim{color:var(--ink-dim)}
  .dossier-body .stub{
    border:1px dashed var(--line);border-radius:5px;padding:12px 14px;
    color:var(--ink-dim);font-size:12.5px;margin-top:14px;
  }
  .dossier-body h4{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-faint);margin:18px 0 8px;
  }
  .linkchips{display:flex;flex-wrap:wrap;gap:6px}
  .linkchips button{
    background:rgba(27,42,69,.5);border:1px solid var(--line);border-radius:99px;
    color:var(--ink-dim);font-size:11.5px;padding:4px 11px;cursor:pointer;font-family:var(--body);
  }
  .linkchips button:hover{color:var(--ink);border-color:var(--accent)}
  .formula{
    font-family:var(--mono);font-size:12.5px;background:rgba(5,8,15,.7);
    border:1px solid var(--line);border-radius:5px;padding:11px 13px;margin:10px 0;
    overflow-x:auto;white-space:nowrap;color:var(--ink);
  }
  .widget{
    border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0 6px;
    background:rgba(5,8,15,.55);
  }
  .widget label{
    display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;
  }
  .widget input[type=range]{width:100%;accent-color:var(--accent)}
  .readout{
    display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums;color:var(--ink-dim);
  }
  .readout b{color:var(--accent);font-weight:600}
  .bar{height:9px;border-radius:99px;background:#18233C;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--c-combat)}

  @media (max-width:640px){
    .brand p{display:none}
    header{padding:12px 14px}
    /* legend becomes a horizontal chip bar along the bottom */
    .legend{
      left:0;right:0;bottom:0;max-width:none;border-radius:0;
      border-left:none;border-right:none;border-bottom:none;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    }
    .legend h2{display:none}
    #legend-items{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .legend button{
      width:auto;white-space:nowrap;flex:none;
      border:1px solid var(--line);border-radius:99px;padding:6px 11px;
    }
    .viewbtns{bottom:calc(62px + env(safe-area-inset-bottom));right:12px}
    /* dossier becomes a bottom sheet so the map stays in view */
    .dossier{
      top:auto;height:76dvh;width:100vw;
      border-left:none;border-top:1px solid var(--line);
      border-radius:14px 14px 0 0;
      transform:translateY(105%);
    }
    .dossier.open{transform:none;box-shadow:0 -18px 50px rgba(0,0,0,.55)}
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<svg id="map" role="application" aria-label="Galaxy map of STFC mechanics topics"></svg>

<header>
  <div class="brand">
    <h1>STFC <em>Mechanics</em> Atlas</h1>
    <p>CONCEPT DEMO · every star is a topic dossier · sample copy only</p>
  </div>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Search mechanics… (Enter to jump)" aria-label="Search topics">
  </div>
</header>

<nav class="legend" aria-label="Topic systems">
  <h2>Systems</h2>
  <div id="legend-items"></div>
</nav>

<div class="viewbtns">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zreset" class="reset" aria-label="Reset view">RESET</button>
</div>

<aside class="dossier" id="dossier" aria-hidden="true">
  <div class="dossier-head">
    <div class="sys"><span class="dot" id="d-dot"></span><span id="d-sys"></span></div>
    <h3 id="d-title"></h3>
    <button class="close" id="d-close" aria-label="Close panel">✕</button>
    <div class="tabs" role="tablist" id="d-tabs"></div>
  </div>
  <div class="dossier-body" id="d-body"></div>
</aside>

<script>
'use strict';
/* ---------------- data ---------------- */

  ['bt','mit'],['mit','pierce'],['mit','smit'],['crit','cfloor'],['wvb','crit'],
  ['hvs','smit'],['shots','delay'],['shots','rounds'],['wvb','shots'],
  ['isod','isodef'],['isod','apex'],

const CONTENT = {
  mit: {
    tldr: `Mitigation is the percentage of incoming weapon damage your ship shrugs off before it ever touches shields or hull. Your three defense stats — Armor, Shield Deflection, Dodge — each get tested against the attacker's matching piercing stat. Win the stat duel, take less damage.`,
    how: `<p>Each defense stat is paired with an attacker piercing stat: Armor vs Armor Piercing, Shield Deflection vs Shield Piercing, Dodge vs Accuracy.</p>
      <p class="dim">Each pair produces a partial mitigation value; the three combine into total mitigation. The curve has strong diminishing returns — stacking defense far past the attacker's piercing buys very little, which is why piercing officers swing fights so hard.</p>`,
    math: `<div class="formula">mit ≈ 1 − ∏ (1 − fᵢ)&nbsp;&nbsp;where&nbsp;&nbsp;fᵢ = 1 / (1 + (Pᵢ/Dᵢ)^1.1)</div>
      <p class="dim">Illustrative curve for the demo — the real page would carry the community-verified formula with test evidence.</p>
      <div class="widget">

  wvb:'Weapon damage is the rolled per-shot value; base damage is the stat line it rolls from. Buffs that touch one do not always touch the other.',

  aloot:'How rewards split across participants — contribution, rank and RNG each play a part.',
  supp:'Support ships buff the fleet without fighting. The buff math interacts with mitigation and officer bonuses.',
  wrange:'How far your ship can jump in one warp — the hard gate on which systems you can even reach.',
  wspeed:'How fast you cross the distance — quality of life that compounds over a thousand jumps.',
  imp:'Sub-light speed inside a system — decides who catches whom in PvP.',
  token:'Token-gated space — entry costs a consumable, and the meter keeps running while you are inside.',
  haz:'Hazard systems tick damage on ships that lack the right resistance — gear checks disguised as geography.',
  shw:'Superhighways move you across the galaxy at a fraction of the cost — if your route touches one.',
  chase:'Hostiles that pursue you across the system — speed and aggro rules decide whether farming is calm or chaos.',
  refit:'Refits re-spec an existing hull — same ship, new stat identity.',
  power:'The power number is a marketing stat. Two ships with equal power can perform wildly differently — this page explains why.',
  costs:'Cost reduction lowers the sticker price; cost efficiency changes the ratio of output per resource. They are not the same lever.',
  sms:'Ship Materials vs Ship Loyalty tokens — two upgrade currencies, two very different scarcity curves.',

};

/* ---------------- layout ---------------- */
const W=1600,H=1000;
const byId={};
{
  const groups={};
  NODES.forEach(n=>{(groups[n.c]=groups[n.c]||[]).push(n)});
  for(const [cid,list] of Object.entries(groups)){
    const cl=CLUSTERS[cid], n=list.length;
    list.forEach((node,i)=>{
      if(n===1){node.x=cl.cx;node.y=cl.cy;}
      else{
        const ang=(i/n)*Math.PI*2 + (cid.length*0.7);
        const rad=(n>6 ? (i%2? 132:82) : 78+(i%2)*30) + ((i*37)%17);
        node.x=cl.cx+Math.cos(ang)*rad*1.15;
        node.y=cl.cy+Math.sin(ang)*rad*0.85;
      }
      byId[node.id]=node;
    });
  }
}

/* ---------------- starfield ---------------- */
const cv=document.getElementById('stars'),cx2=cv.getContext('2d');
let starsArr=[];
function seedStars(){
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  starsArr=Array.from({length:260},(_, i)=>({
    x:((i*991)%1000)/1000*cv.width, y:((i*757)%1000)/1000*cv.height,
    r:(0.4+((i*13)%10)/14)*devicePixelRatio, p:(i%628)/100, s:0.5+((i*7)%10)/12
  }));
}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawStars(t){
  cx2.clearRect(0,0,cv.width,cv.height);
  for(const s of starsArr){
    const tw=reduceMotion?0.75:0.55+0.45*Math.sin(t/900*s+s.p*6);
    cx2.globalAlpha=0.25+0.55*tw;
    cx2.fillStyle='#CBD8EF';
    cx2.beginPath();cx2.arc(s.x,s.y,s.r,0,7);cx2.fill();
  }
  if(!reduceMotion)requestAnimationFrame(drawStars);
}
seedStars();requestAnimationFrame(drawStars);
addEventListener('resize',()=>{seedStars();updateLabels();if(reduceMotion)requestAnimationFrame(drawStars)});

/* ---------------- svg build ---------------- */
const svg=document.getElementById('map');
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  (parent||svg).appendChild(e);return e;
}
const gLanes=el('g',{}),gNodes=el('g',{});
const laneEls=[];
for(const [a,b,cross] of LINKS){
  const A=byId[a],B=byId[b];
  if(!A||!B)continue;
  const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
  const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
  const bow=cross?26:10;
  const cxp=mx-dy/len*bow, cyp=my+dx/len*bow;
  const p=el('path',{d:`M${A.x} ${A.y} Q${cxp} ${cyp} ${B.x} ${B.y}`,
    class:'lane'+(cross?' cross':'')},gLanes);
  if(!cross)p.setAttribute('stroke',CLUSTERS[A.c].color);
  laneEls.push({p,a,b});
}
for(const [cid,cl] of Object.entries(CLUSTERS)){
  el('text',{x:cl.lx,y:cl.ly,'text-anchor':'middle','font-size':15,class:'cluster-label'},gLanes)
    .textContent=cl.name;
}
const nodeEls={};
for(const n of NODES){
  const g=el('g',{class:'node'+(n.big?' big':''),tabindex:0,role:'button','aria-label':n.n},gNodes);
  const col=CLUSTERS[n.c].color, r=n.big?7:4.5;
  el('circle',{cx:n.x,cy:n.y,r:20,fill:'transparent',class:'hit'},g);
  el('circle',{cx:n.x,cy:n.y,r:r*2.6,fill:col,class:'halo'},g);
  el('circle',{cx:n.x,cy:n.y,r:r,fill:col,class:'core'},g);
  const t=el('text',{x:n.x,y:n.y+r+13,'text-anchor':'middle'},g);
  t.textContent=n.n;
  g.addEventListener('click',()=>openDossier(n.id));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDossier(n.id)}});
  g.addEventListener('mouseenter',()=>highlight(n.id));
  g.addEventListener('mouseleave',()=>highlight(null));
  nodeEls[n.id]=g;
}
function highlight(id){
  if(!id){
    laneEls.forEach(l=>l.p.classList.remove('lit','dimmed'));
    Object.values(nodeEls).forEach(g=>g.classList.remove('lit','dimmed'));
    return;
  }
  const neigh=new Set([id]);
  laneEls.forEach(l=>{
    const on=l.a===id||l.b===id;
    l.p.classList.toggle('lit',on);l.p.classList.toggle('dimmed',!on);
    if(on){neigh.add(l.a);neigh.add(l.b)}
  });
  for(const [nid,g] of Object.entries(nodeEls)){
    g.classList.toggle('lit',neigh.has(nid)&&nid!==id);
    g.classList.toggle('dimmed',!neigh.has(nid));
  }
}

/* ---------------- pan & zoom ---------------- */
let vb={x:0,y:0,w:W,h:H};
function fitInitial(){
  const ar=innerWidth/innerHeight, mar=ar>W/H;
  vb = mar ? {w:H*ar,h:H,x:-(H*ar-W)/2,y:0} : {w:W,h:W/ar,x:0,y:-(W/ar-H)/2};
  applyVB();
}
function applyVB(){
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  updateLabels();
}
/* Keep labels legible at any zoom: when zoomed far out (small screens),
   hide minor labels and scale system/flagship text to constant screen size.
   Above the threshold, desktop rendering is untouched. */
function updateLabels(){
  const rw=svg.getBoundingClientRect().width||innerWidth;
  const s=rw/vb.w;
  const out=s<0.42;
  svg.classList.toggle('zoomed-out',out);
  svg.style.setProperty('--bigfs',out?Math.min(11/s,44)+'px':'10.5px');
  svg.style.setProperty('--clusterfs',out?Math.min(13/s,52)+'px':'15px');
  svg.style.setProperty('--hitr',out?Math.min(24/s,70)+'px':'20px');
}
function zoomAt(px,py,f){
  const r=svg.getBoundingClientRect();
  const mx=vb.x+(px-r.left)/r.width*vb.w, my=vb.y+(py-r.top)/r.height*vb.h;
  const w=Math.min(Math.max(vb.w*f,300),3200), h=w*vb.h/vb.w;
  vb={x:mx-(mx-vb.x)*w/vb.w, y:my-(my-vb.y)*h/vb.h, w, h};
  applyVB();
}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?1.12:0.89)},{passive:false});
/* one finger pans, two fingers pinch-zoom */
const pts=new Map();
let pinchDist=0;
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')&&pts.size===0)return;
  svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)svg.classList.add('dragging');
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    pinchDist=Math.hypot(a.x-b.x,a.y-b.y);
  }
});
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const prev=pts.get(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=svg.getBoundingClientRect();
  if(pts.size===1){
    vb.x-=(e.clientX-prev.x)/r.width*vb.w;
    vb.y-=(e.clientY-prev.y)/r.height*vb.h;
    applyVB();
  }else if(pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchDist>0&&d>0)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinchDist/d);
    pinchDist=d;
  }
});
const liftPointer=e=>{
  pts.delete(e.pointerId);pinchDist=0;
  if(!pts.size)svg.classList.remove('dragging');
};
addEventListener('pointerup',liftPointer);
addEventListener('pointercancel',liftPointer);
document.getElementById('zin').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,0.8);
document.getElementById('zout').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.25);
document.getElementById('zreset').onclick=fitInitial;
function panTo(x,y,w){
  if(innerWidth<640)w=Math.min(w,430); // zoom in closer on phones so labels are readable
  vb={x:x-w/2,y:y-(w*vb.h/vb.w)/2,w,h:w*vb.h/vb.w};applyVB();
}
fitInitial();

/* ---------------- legend ---------------- */
{
  const holder=document.getElementById('legend-items');
  for(const [cid,cl] of Object.entries(CLUSTERS)){
    const b=document.createElement('button');
    b.innerHTML=`<span class="dot" style="background:${cl.color}"></span>${cl.name}`;
    b.onclick=()=>panTo(cl.cx,cl.cy,620);
    holder.appendChild(b);
  }
}

/* ---------------- dossier ---------------- */
const dossier=document.getElementById('dossier');
const dTabs=document.getElementById('d-tabs'), dBody=document.getElementById('d-body');
let currentId=null;
function openDossier(id){
  const n=byId[id];if(!n)return;
  currentId=id;
  const cl=CLUSTERS[n.c];
  document.getElementById('d-dot').style.background=cl.color;
  document.getElementById('d-sys').textContent=cl.name+' system';
  document.getElementById('d-title').textContent=n.n;
  Object.values(nodeEls).forEach(g=>g.classList.remove('selected'));
  nodeEls[id].classList.add('selected');
  const c=CONTENT[id];
  const tabs=c?['TL;DR','How it works','The math']:['TL;DR'];
  dTabs.innerHTML='';
  tabs.forEach((t,i)=>{
    const b=document.createElement('button');
    b.textContent=t;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',i===0?'true':'false');
    b.onclick=()=>{selectTab(id,i)};
    dTabs.appendChild(b);
  });
  selectTab(id,0);
  dossier.classList.add('open');dossier.setAttribute('aria-hidden','false');
}
function neighborsOf(id){
  const s=new Set();
  laneEls.forEach(l=>{if(l.a===id)s.add(l.b);if(l.b===id)s.add(l.a)});
  return [...s];
}
function selectTab(id,idx){
  [...dTabs.children].forEach((b,i)=>b.setAttribute('aria-selected',i===idx?'true':'false'));
  const c=CONTENT[id];
  let html='';
  if(idx===0){
    const tl=c?c.tldr:(TLDR[id]||'Topic summary goes here.');
    html=`<p>${tl}</p>`;
    if(!c)html+=`<div class="stub">Concept demo stub — in the real atlas this dossier gets the full layered treatment: how it works, the math, and linked combat-log evidence.</div>`;
  }else if(idx===1){html=c.how}
  else{html=c.math}
  const nb=neighborsOf(id);
  if(nb.length){
    html+=`<h4>Warp lanes — related mechanics</h4><div class="linkchips">`+
      nb.map(x=>`<button data-jump="${x}">${byId[x].n}</button>`).join('')+`</div>`;
  }
  dBody.innerHTML=html;
  dBody.querySelectorAll('[data-jump]').forEach(b=>{
    b.onclick=()=>{const t=b.dataset.jump;panTo(byId[t].x,byId[t].y,700);openDossier(t)};
  });
  const slider=document.getElementById('w-pierce');
  if(slider){
    const D=100000, fmt=v=>v>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1000)+'K';
    const upd=()=>{
      const P=Math.pow(10,4+slider.value*2/100);
      const mit=1/(1+Math.pow(P/D,1.1));
      document.getElementById('w-pval').textContent=fmt(P);
      document.getElementById('w-mval').textContent=Math.round(mit*100)+'%';
      document.getElementById('w-bar').style.width=(mit*100)+'%';
      document.getElementById('w-dmg').textContent=
        Math.round(100000*(1-mit)).toLocaleString()+' / 100,000 gets through';
    };
    slider.addEventListener('input',upd);upd();
  }
}
function closeDossier(){
  dossier.classList.remove('open');dossier.setAttribute('aria-hidden','true');
  Object.values(nodeEls).forEach(g=>g.classList.remove('selected'));
  currentId=null;
}
document.getElementById('d-close').onclick=closeDossier;
addEventListener('keydown',e=>{if(e.key==='Escape')closeDossier()});

/* ---------------- search ---------------- */
const search=document.getElementById('search');
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  for(const n of NODES){
    const hit=q&&n.n.toLowerCase().includes(q);
    nodeEls[n.id].classList.toggle('hit',!!hit);
    nodeEls[n.id].classList.toggle('dimmed',!!q&&!hit);
  }
  if(!q)Object.values(nodeEls).forEach(g=>g.classList.remove('dimmed','hit'));
});
search.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.keyCode!==13)return;
  const q=search.value.trim().toLowerCase();if(!q)return;
  const hitNode=NODES.find(n=>n.n.toLowerCase().includes(q));
  if(hitNode){panTo(hitNode.x,hitNode.y,700);openDossier(hitNode.id)}
});
</script>
</body>
